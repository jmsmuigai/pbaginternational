name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build API
        run: npm run build:api

      - name: Build web (Next.js)
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

      - name: Run end-to-end ticket flow simulation
        run: npm run simulate:ticket-flow
        env:
          DB_DRIVER: memory
          MPESA_MODE: mock
