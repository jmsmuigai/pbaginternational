<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Theatre and film consultancy, powered by generative AI</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="55%" stop-color="#2A1910"/>
      <stop offset="100%" stop-color="#4A291A"/>
    </linearGradient>
    <linearGradient id="clapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#B33924"/>
    </linearGradient>
    <linearGradient id="clapGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#822617"/>
      <stop offset="100%" stop-color="#B33924"/>
    </linearGradient>
    <linearGradient id="maskGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="maskEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FAE57"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E64A19" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E64A19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- ambient glows -->
  <circle cx="230" cy="180" r="260" fill="url(#glowGold)"/>
  <circle cx="980" cy="560" r="300" fill="url(#glowCoral)"/>
  <circle cx="950" cy="150" r="220" fill="url(#glowBlue)"/>

  <!-- film strip border, top -->
  <g opacity="0.55">
    <rect x="0" y="0" width="1200" height="46" fill="#0D0D0D"/>
    <g fill="#F9F6F0" opacity="0.35">
      <rect x="20" y="12" width="22" height="22" rx="4"/>
      <rect x="70" y="12" width="22" height="22" rx="4"/>
      <rect x="120" y="12" width="22" height="22" rx="4"/>
      <rect x="170" y="12" width="22" height="22" rx="4"/>
      <rect x="220" y="12" width="22" height="22" rx="4"/>
      <rect x="270" y="12" width="22" height="22" rx="4"/>
      <rect x="930" y="12" width="22" height="22" rx="4"/>
      <rect x="980" y="12" width="22" height="22" rx="4"/>
      <rect x="1030" y="12" width="22" height="22" rx="4"/>
      <rect x="1080" y="12" width="22" height="22" rx="4"/>
      <rect x="1130" y="12" width="22" height="22" rx="4"/>
    </g>
  </g>

  <!-- neural / agentic-AI circuit lines connecting the icons -->
  <g stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 300 360 C 420 250, 520 250, 610 340" stroke-dasharray="2 10"/>
    <path d="M 610 340 C 700 430, 780 430, 860 360" stroke-dasharray="2 10"/>
    <path d="M 610 340 L 610 470" stroke-dasharray="2 10"/>
  </g>
  <g fill="#D4AF37">
    <circle cx="300" cy="360" r="6"/>
    <circle cx="610" cy="340" r="7"/>
    <circle cx="860" cy="360" r="6"/>
    <circle cx="610" cy="470" r="5"/>
    <circle cx="455" cy="290" r="4"/>
    <circle cx="735" cy="390" r="4"/>
  </g>

  <!-- Comedy & tragedy masks (theatre consultancy) -->
  <g transform="translate(140,420)">
    <ellipse cx="90" cy="130" rx="120" ry="24" fill="#000" opacity="0.35"/>
    <path d="M10,60 Q0,-20 90,-30 Q180,-20 170,60 Q170,140 90,150 Q10,140 10,60 Z" fill="url(#maskGoldGrad)"/>
    <path d="M50,55 Q65,40 80,55" stroke="#4A291A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M100,55 Q115,40 130,55" stroke="#4A291A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M55,100 Q90,135 125,100" stroke="#4A291A" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(300,455)">
    <path d="M10,60 Q0,-20 90,-30 Q180,-20 170,60 Q170,140 90,150 Q10,140 10,60 Z" fill="url(#maskEmeraldGrad)"/>
    <path d="M50,50 Q65,65 80,50" stroke="#0D0D0D" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M100,50 Q115,65 130,50" stroke="#0D0D0D" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M55,115 Q90,90 125,115" stroke="#0D0D0D" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Clapperboard (film consultancy) -->
  <g transform="translate(520,300)">
    <ellipse cx="90" cy="230" rx="110" ry="20" fill="#000" opacity="0.35"/>
    <rect x="0" y="40" width="180" height="150" rx="10" fill="url(#clapGrad2)"/>
    <rect x="0" y="40" width="180" height="150" rx="10" fill="none" stroke="#F9F6F0" stroke-opacity="0.15" stroke-width="2"/>
    <g transform="translate(0,0) rotate(-8 90 40)">
      <rect x="-4" y="0" width="188" height="42" rx="8" fill="url(#clapGrad)"/>
      <g fill="#0D0D0D" opacity="0.85">
        <polygon points="10,0 34,0 22,42 -2,42"/>
        <polygon points="55,0 79,0 67,42 43,42"/>
        <polygon points="100,0 124,0 112,42 88,42"/>
        <polygon points="145,0 169,0 157,42 133,42"/>
      </g>
    </g>
    <text x="90" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#F9F6F0">PBAG</text>
    <text x="90" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#F9F6F0" opacity="0.7">CONSULTANCY</text>
  </g>

  <!-- Film reel (production) -->
  <g transform="translate(760,410)">
    <circle cx="70" cy="70" r="70" fill="url(#reelGrad)"/>
    <circle cx="70" cy="70" r="58" fill="none" stroke="#0D0D0D" stroke-width="6" opacity="0.4"/>
    <circle cx="70" cy="70" r="16" fill="#0D0D0D" opacity="0.5"/>
    <g fill="#0D0D0D" opacity="0.5">
      <circle cx="70" cy="24" r="11"/>
      <circle cx="112" cy="50" r="11"/>
      <circle cx="112" cy="92" r="11"/>
      <circle cx="70" cy="118" r="11"/>
      <circle cx="28" cy="92" r="11"/>
      <circle cx="28" cy="50" r="11"/>
    </g>
  </g>

  <!-- spark / AI motif above the clapperboard -->
  <g transform="translate(585,180)" fill="#D4AF37">
    <path d="M20 0 L25 15 L40 20 L25 25 L20 40 L15 25 L0 20 L15 15 Z"/>
  </g>
  <g transform="translate(660,220)" fill="#E64A19" opacity="0.85">
    <path d="M12 0 L15 9 L24 12 L15 15 L12 24 L9 15 L0 12 L9 9 Z"/>
  </g>

  <!-- film strip border, bottom -->
  <g opacity="0.55">
    <rect x="0" y="674" width="1200" height="46" fill="#0D0D0D"/>
    <g fill="#F9F6F0" opacity="0.35">
      <rect x="20" y="686" width="22" height="22" rx="4"/>
      <rect x="70" y="686" width="22" height="22" rx="4"/>
      <rect x="120" y="686" width="22" height="22" rx="4"/>
      <rect x="930" y="686" width="22" height="22" rx="4"/>
      <rect x="980" y="686" width="22" height="22" rx="4"/>
      <rect x="1030" y="686" width="22" height="22" rx="4"/>
      <rect x="1080" y="686" width="22" height="22" rx="4"/>
      <rect x="1130" y="686" width="22" height="22" rx="4"/>
    </g>
  </g>
</svg>
