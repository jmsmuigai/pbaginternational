<svg viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p1" preserveAspectRatio="xMidYMid slice">
  <title id="p1">Decorative woven pattern strip</title>
  <defs>
    <pattern id="weave" width="40" height="60" patternUnits="userSpaceOnUse">
      <rect width="40" height="60" fill="none"/>
